name: Mobile Tests

# Labels each run in the Actions list with which suite actually ran and why
# (manual / scheduled / push) — otherwise every run just shows the commit
# message, making it hard to tell a manual smoke dispatch apart from a
# regression one at a glance.
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && format('Manual · {0} suite (API {1})', inputs.suite, inputs.api-level) ||
    github.event_name == 'schedule' && format('Scheduled · {0}', github.event.schedule == '30 0 * * *' && 'smoke (06:00 IST)' || 'regression (22:00 IST)') ||
    format('{0} · full suite', github.event_name)
  }}

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        required: true
        default: 'all'
        type: choice
        options: ['all', 'smoke', 'regression']
      api-level:
        description: 'Android API level to run against'
        required: false
        default: '30'
  schedule:
    # GitHub Actions cron is UTC; IST is UTC+5:30.
    - cron: '30 0 * * *' # 06:00 IST daily — smoke
    - cron: '30 16 * * *' # 22:00 IST daily — regression

# A new push/dispatch on the same ref cancels whatever's already running for
# it, rather than letting two emulator jobs race each other. Scheduled runs
# get their own group per cron schedule so a smoke run never cancels a
# regression run (or vice versa) just for landing at a similar time.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && github.event.schedule || '' }}
  cancel-in-progress: true

env:
  APK_URL: https://github.com/appium/appium/raw/1.x/sample-code/apps/ApiDemos-debug.apk
  APP_PATH: ./apps/ApiDemos-debug.apk
  APPIUM_HOST: 127.0.0.1
  APPIUM_PORT: '4723'
  PLATFORM_VERSION: '11.0'
  DEVICE_NAME: emulator-5554
  TEST_ENV: CI

jobs:
  # ---------------------------------------------------------------------------
  # Fast quality gate: type-checking + linting, no emulator required.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Full end-to-end run: Android emulator + Appium 2 + UiAutomator2.
  # ---------------------------------------------------------------------------
  android-tests:
    name: Android E2E Tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install npm dependencies
      - name: Install npm dependencies
        run: npm ci

      # 4. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download ApiDemos APK
        run: |
          mkdir -p apps
          curl -fL --retry 3 --retry-delay 5 -o "${APP_PATH}" "${APK_URL}"
          ls -la apps/

      # 7 & 8. Appium 2 and the UiAutomator2 driver (pinned to 4.2.9 — the
      # last release compatible with Appium 2.x; 5.0.0+ requires Appium 3,
      # see README > Version Notes). Both already came in via `npm ci` above:
      # Appium 2's project-local driver management recorded
      # appium-uiautomator2-driver as a real devDependency the first time it
      # was installed (see package.json), so it's restored automatically on
      # every install — no separate `appium driver install` step needed, and
      # running one here would fail with "already installed". This step just
      # verifies that came through correctly.
      - name: Verify UiAutomator2 driver is present
        run: |
          npx appium driver list --installed
          npx appium driver list --installed --json | grep -q '"uiautomator2"'

      # The AVD cache below only ever covered ~/.android/avd (the AVD's own
      # config/data) — not the actual system image binaries under
      # $ANDROID_HOME/system-images, which live elsewhere and used to get
      # installed as a side effect of the (now-removed) reactivecircus
      # action always running for the test-execution step too. Once that
      # step stopped using the action, a cache *hit* here (which skips "Create
      # AVD snapshot for caching" below) meant nothing installed the system
      # image at all — reproduced directly: `emulator -avd test` failed with
      # "FATAL | Broken AVD system path" because
      # system-images/android-30/google_apis/x86_64/ genuinely didn't exist,
      # and our own script's plain `adb wait-for-device` then hung forever
      # waiting for a device that could never appear, since nothing had
      # actually started. Installing it explicitly here makes it unconditional
      # and correct regardless of AVD cache state; caching it too (bumped to
      # v2 since the cached path set changed) just avoids re-downloading it
      # on every run.
      - name: Install Android system image
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "system-images;android-${{ inputs.api-level || '30' }};google_apis;x86_64"

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ${{ env.ANDROID_HOME }}/system-images
          key: avd-${{ inputs.api-level || '30' }}-v2

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ fromJSON(inputs.api-level || '30') }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD created and cached."

      # Resolve which suite this run should execute:
      #  - scheduled 06:00 IST run  -> smoke only
      #  - scheduled 22:00 IST run  -> regression only
      #  - manual dispatch          -> whatever `suite` input was chosen
      #  - push / pull_request      -> full suite (smoke + regression)
      - name: Determine which suite to run
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '30 0 * * *')
                echo "command=npm run test:smoke" >> "$GITHUB_OUTPUT"
                echo "label=smoke (scheduled 06:00 IST)" >> "$GITHUB_OUTPUT"
                ;;
              '30 16 * * *')
                echo "command=npm run test:regression" >> "$GITHUB_OUTPUT"
                echo "label=regression (scheduled 22:00 IST)" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "command=npm run test:android" >> "$GITHUB_OUTPUT"
                echo "label=full suite (unrecognized schedule: ${{ github.event.schedule }})" >> "$GITHUB_OUTPUT"
                ;;
            esac
          elif [ "${{ inputs.suite || 'all' }}" != "all" ]; then
            echo "command=npm run test:${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
            echo "label=${{ inputs.suite }} (manual dispatch)" >> "$GITHUB_OUTPUT"
          else
            echo "command=npm run test:android" >> "$GITHUB_OUTPUT"
            echo "label=full suite (${{ github.event_name }})" >> "$GITHUB_OUTPUT"
          fi

      # 6 & 9. Start the Android Emulator, 10. Start Appium server, 11. Execute tests
      #
      # Boots the emulator directly as a plain background process under our
      # own control, rather than via `reactivecircus/android-emulator-runner`
      # (still used below for AVD creation/caching only): that action's
      # post-script cleanup was found to hang indefinitely waiting on
      # orphaned `crashpad_handler` processes after a test run — see
      # reactivecircus/android-emulator-runner#385 — with no reliable
      # workaround from the outside. A plain `run:` step sidesteps it
      # entirely: one continuous bash process end to end, and it ends the
      # moment our own `exit` runs, with no other party's cleanup left to
      # hang on. Restores the AVD ("test", this action's documented default
      # name) and snapshot the caching step below already created.
      - name: Boot emulator, start Appium, and run tests
        timeout-minutes: 12
        run: |
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p logs

          nohup emulator -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save > logs/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid

          # `adb wait-for-device` has no built-in timeout — if the emulator
          # process fails to start (wrong system image, crash, etc.) it
          # blocks forever waiting for a device that will never appear.
          # Reproduced exactly this way once already. `timeout` bounds it and
          # dumps the emulator's own log for diagnosis instead of leaving the
          # 12-minute step cap as the only signal something's wrong.
          if ! timeout 90 adb wait-for-device; then
            echo "::error::adb wait-for-device timed out — emulator process likely failed to start"
            cat logs/emulator.log || true
            exit 1
          fi
          BOOT_COMPLETED=""
          for i in $(seq 1 100); do
            BOOT_COMPLETED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT_COMPLETED" = "1" ]; then
              break
            fi
            sleep 3
          done
          if [ "$BOOT_COMPLETED" != "1" ]; then
            echo "::error::Emulator did not report sys.boot_completed=1 in time"
            cat logs/emulator.log || true
            exit 1
          fi
          echo "Emulator booted."

          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true

          npx appium server --port "$APPIUM_PORT" --relaxed-security --log ./logs/appium.log & echo $! > /tmp/appium.pid
          npx wait-on -t 60000 "http://${APPIUM_HOST}:${APPIUM_PORT}/status"

          echo "Running: ${{ steps.suite.outputs.label }}"
          set +e
          ${{ steps.suite.outputs.command }}
          TEST_EXIT_CODE=$?
          set -e

          kill -TERM "$(cat /tmp/appium.pid 2>/dev/null)" 2>/dev/null || true
          sleep 1
          kill -KILL "$(cat /tmp/appium.pid 2>/dev/null)" 2>/dev/null || true

          adb -s emulator-5554 emu kill 2>/dev/null || true
          sleep 2
          kill -KILL "$(cat /tmp/emulator.pid 2>/dev/null)" 2>/dev/null || true
          pkill -KILL -f qemu-system 2>/dev/null || true
          pkill -KILL -x crashpad_handler 2>/dev/null || true

          exit $TEST_EXIT_CODE

      # 12. Generate Allure report — always, so a failing suite still produces a report
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Write job summary
        if: always()
        run: |
          echo "## Mobile Test Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suite: ${{ steps.suite.outputs.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: Android emulator (API ${{ inputs.api-level || '30' }}), UiAutomator2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allure results: see the *allure-report* artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screenshots (failures only): see the *screenshots* artifact" >> "$GITHUB_STEP_SUMMARY"

      # 13. Upload screenshots and reports as GitHub Actions artifacts
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
