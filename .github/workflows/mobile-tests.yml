name: Mobile Tests

# Labels each run in the Actions list with which suite actually ran and why
# (manual / scheduled / push) — otherwise every run just shows the commit
# message, making it hard to tell a manual smoke dispatch apart from a
# regression one at a glance.
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && format('Manual · {0} suite (API {1})', inputs.suite, inputs.api-level) ||
    github.event_name == 'schedule' && format('Scheduled · {0}', github.event.schedule == '30 0 * * *' && 'smoke (06:00 IST)' || 'regression (22:00 IST)') ||
    format('{0} · full suite', github.event_name)
  }}

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        required: true
        default: 'all'
        type: choice
        options: ['all', 'smoke', 'regression']
      api-level:
        description: 'Android API level to run against'
        required: false
        default: '30'
  schedule:
    # GitHub Actions cron is UTC; IST is UTC+5:30.
    - cron: '30 0 * * *' # 06:00 IST daily — smoke
    - cron: '30 16 * * *' # 22:00 IST daily — regression

env:
  APK_URL: https://github.com/appium/appium/raw/1.x/sample-code/apps/ApiDemos-debug.apk
  APP_PATH: ./apps/ApiDemos-debug.apk
  APPIUM_HOST: 127.0.0.1
  APPIUM_PORT: '4723'
  PLATFORM_VERSION: '11.0'
  DEVICE_NAME: emulator-5554
  TEST_ENV: CI

jobs:
  # ---------------------------------------------------------------------------
  # Fast quality gate: type-checking + linting, no emulator required.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Full end-to-end run: Android emulator + Appium 2 + UiAutomator2.
  # ---------------------------------------------------------------------------
  android-tests:
    name: Android E2E Tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install npm dependencies
      - name: Install npm dependencies
        run: npm ci

      # 4. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download ApiDemos APK
        run: |
          mkdir -p apps
          curl -fL --retry 3 --retry-delay 5 -o "${APP_PATH}" "${APK_URL}"
          ls -la apps/

      # 7 & 8. Appium 2 and the UiAutomator2 driver (pinned to 4.2.9 — the
      # last release compatible with Appium 2.x; 5.0.0+ requires Appium 3,
      # see README > Version Notes). Both already came in via `npm ci` above:
      # Appium 2's project-local driver management recorded
      # appium-uiautomator2-driver as a real devDependency the first time it
      # was installed (see package.json), so it's restored automatically on
      # every install — no separate `appium driver install` step needed, and
      # running one here would fail with "already installed". This step just
      # verifies that came through correctly.
      - name: Verify UiAutomator2 driver is present
        run: |
          npx appium driver list --installed
          npx appium driver list --installed --json | grep -q '"uiautomator2"'

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api-level || '30' }}-v1

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ fromJSON(inputs.api-level || '30') }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD created and cached."

      # Resolve which suite this run should execute:
      #  - scheduled 06:00 IST run  -> smoke only
      #  - scheduled 22:00 IST run  -> regression only
      #  - manual dispatch          -> whatever `suite` input was chosen
      #  - push / pull_request      -> full suite (smoke + regression)
      - name: Determine which suite to run
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '30 0 * * *')
                echo "command=npm run test:smoke" >> "$GITHUB_OUTPUT"
                echo "label=smoke (scheduled 06:00 IST)" >> "$GITHUB_OUTPUT"
                ;;
              '30 16 * * *')
                echo "command=npm run test:regression" >> "$GITHUB_OUTPUT"
                echo "label=regression (scheduled 22:00 IST)" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "command=npm run test:android" >> "$GITHUB_OUTPUT"
                echo "label=full suite (unrecognized schedule: ${{ github.event.schedule }})" >> "$GITHUB_OUTPUT"
                ;;
            esac
          elif [ "${{ inputs.suite || 'all' }}" != "all" ]; then
            echo "command=npm run test:${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
            echo "label=${{ inputs.suite }} (manual dispatch)" >> "$GITHUB_OUTPUT"
          else
            echo "command=npm run test:android" >> "$GITHUB_OUTPUT"
            echo "label=full suite (${{ github.event_name }})" >> "$GITHUB_OUTPUT"
          fi

      # 6 & 9. Start the Android Emulator, 10. Start Appium server, 11. Execute tests
      #
      # This step hung repeatedly during development — tests always passed in
      # well under a minute, but the step itself then sat for 25-40+ minutes
      # before something (usually the job timeout) ended it. Root-caused by
      # reading full logs from several cancelled/timed-out runs rather than
      # guessing:
      #
      #   - Saving a snapshot of an emulator that just rendered a full test
      #     run can hang indefinitely (a known reactivecircus/android-
      #     emulator-runner behavior). Fixed with `-no-snapshot-save` below —
      #     this step restores from the snapshot the caching step already
      #     saved, so it never needs to save its own on exit.
      #   - Our own script wasn't reliably killing the backgrounded Appium
      #     process: `$!` (its PID) doesn't survive from the line that
      #     backgrounds it to a later line here, so `kill "$APPIUM_PID"` was
      #     silently killing nothing ("kill: Illegal number:" in the log).
      #     Fixed with a PID file instead of a shell variable — written on
      #     the same line where `$!` is valid, read back from disk wherever
      #     it's needed after, which survives regardless of whatever this
      #     action's line/shell semantics are doing.
      #   - Even with Appium correctly killed and `adb emu kill` succeeding
      #     immediately, the step *still* hung the same way. That confirmed
      #     the real, final cause: orphaned `crashpad_handler` processes (the
      #     emulator's own crash-reporter children — see reactivecircus/
      #     android-emulator-runner#385), which this action's cleanup waits
      #     on but which don't reliably exit on their own. Killed explicitly
      #     below, by exact process name (`pkill -x`, not `-f`) — `-f`
      #     matches a process's full command line, which would match our own
      #     `pkill -f crashpad_handler` line's argv and kill its own caller
      #     (hit this exact self-match bug with an earlier `-f "appium
      #     server"` attempt: tests passed, then the step failed with "exit
      #     code null", i.e. killed by its own signal).
      #
      # `timeout-minutes` bounds the damage if a hang recurs anyway: it fails
      # fast in ~12 minutes instead of silently eating the full 40-minute job
      # budget, and `if: always()` steps below (Allure/artifacts) still run.
      - name: Boot emulator, start Appium, and run tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 0
        with:
          api-level: ${{ fromJSON(inputs.api-level || '30') }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: |
            mkdir -p logs
            npx appium server --port "$APPIUM_PORT" --relaxed-security --log ./logs/appium.log & echo $! > /tmp/appium.pid
            npx wait-on -t 60000 "http://${APPIUM_HOST}:${APPIUM_PORT}/status"
            echo "Running: ${{ steps.suite.outputs.label }}"
            ${{ steps.suite.outputs.command }}
            TEST_EXIT_CODE=$?
            kill -TERM "$(cat /tmp/appium.pid 2>/dev/null)" 2>/dev/null || true
            sleep 2
            kill -KILL "$(cat /tmp/appium.pid 2>/dev/null)" 2>/dev/null || true
            pkill -TERM -x crashpad_handler 2>/dev/null || true
            sleep 1
            pkill -KILL -x crashpad_handler 2>/dev/null || true
            exit $TEST_EXIT_CODE

      # 12. Generate Allure report — always, so a failing suite still produces a report
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Write job summary
        if: always()
        run: |
          echo "## Mobile Test Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suite: ${{ steps.suite.outputs.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: Android emulator (API ${{ inputs.api-level || '30' }}), UiAutomator2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allure results: see the *allure-report* artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screenshots (failures only): see the *screenshots* artifact" >> "$GITHUB_STEP_SUMMARY"

      # 13. Upload screenshots and reports as GitHub Actions artifacts
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
